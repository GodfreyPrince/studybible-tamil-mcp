[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "studybible-tamil-mcp"
version = "1.0.0"
description = "Tamil Bible study MCP server: Tamil scripture (IRV + traditional BSI layer), Greek/Hebrew lexicons with Tamil glosses, Tamil study notes/dictionary/Q&A, hermeneutics in Tamil"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Study Bible Tamil contributors"}
]
keywords = ["bible", "tamil", "தமிழ்", "mcp", "claude", "greek", "hebrew", "lexicon", "hermeneutics", "theology"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Religion",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Religion",
]

dependencies = [
    "mcp==1.26.0",
    "httpx>=0.25.0",
    "aiosqlite>=0.19.0",
    "pydantic>=2.0.0",
    "click>=8.0.0",
    "rich>=13.0.0",
    "sqlite-vec>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]
sse = [
    "starlette>=0.32.0",
    "uvicorn>=0.24.0",
    "sse-starlette>=1.6.0",
]

[project.scripts]
studybible-tamil-mcp = "study_bible_tamil_mcp.server:main"

[project.urls]
Homepage = "https://github.com/djayatillake/studybible-mcp"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.sql", "*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
